name: Build QuickRidesBW APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: quickridesbw
        run: flutter create --platforms=android --project-name quickrides_bw .
      - name: Dependencies
        working-directory: quickridesbw
        run: flutter pub get
      - name: Build APK
        working-directory: quickridesbw
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: QuickRidesBW-release-apk
          path: quickridesbw/build/app/outputs/flutter-apk/app-release.apk
